# Builds both release images on our own build server for a pull request that changes them, without pushing or signing,
# so a change to an image or to its workflow is proven before a release tag publishes it. Pull requests from forks never
# reach the build server.
name: Docker image check

on:
  pull_request:
    paths:
      - "docker/**"
      - ".github/workflows/docker-image*.yml"

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.RUNNER_TK_4 || 'tk-4' }}
    strategy:
      fail-fast: false
      matrix:
        file: [docker/Dockerfile, docker/team-server/Dockerfile]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: false
